<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zhozabel</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="shortcut icon" href="image/icons/brandicons/icon-peach.svg" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Quicksand:wght@300..700&display=swap"
    rel="stylesheet"
  >
</head>

<body>
<header class="header">
  <div class="header_container">
    <nav class="header_nav">
      <img src="image/logos/logo_color_horizontal_without_outline.svg" alt="">
      <ul class="header_list">
        <li class="header_list-item">
          <a class="header_list-link" href="index.html">About</a>
        </li>
        <li class="header_list-item">
          <a class="header_list-link" href="/">Wiki</a>
        </li>
        <li class="header_list-item">
          <a class="header_list-link" href="/">Contact</a>
        </li>
        <li class="header_list-item">
          <a class="header_button" href="/">Commissions</a>
        </li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="art-archive">
    <div class="art-archive_container">
      <div class="art-art-archive_content">
        <div class="art-archive_text">
          <span class="art-archive_category">05 · Visual</span>
          <h2 class="art-archive_title">
            For me
          </h2>
          <p class="art-archive_desc">
            Little treasures featuring my characters, lovingly made by other artists and collected by me.
          </p>
        </div>
      </div>
      <div class="gifts_gallery"></div>
    </div>
  </section>
</main>

<script src="js/gifts.js"></script>

<footer>
  <div class="footer_container">
    <div class="footer_content">
      <div class="footer_copyright">
        ©
        <span id="copyright-year"></span>
        <script>
          document.getElementById('copyright-year').textContent = new Date().getFullYear();
        </script>

    </div>
  </div>
