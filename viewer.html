<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <title>Zhozabel</title>
  <link
    rel="stylesheet"
    href="css/style.css"
  >
  <link
    rel="stylesheet"
    href="css/viewer.css"
  >
  <link rel="shortcut icon" href="image/icons/brandicons/icon-peach.svg" type="image/x-icon">
</head>


<body>

<main>

  <section class="viewer">

    <button
      class="viewer_close"
      type="button"
      aria-label="Close"
    >
      <svg
        class="close_cross"
        viewBox="0 0 24 24"
        width="24"
        height="24"
        aria-hidden="true"
      >
        <use href="image/icons/navigation.svg#close_cross_medium"></use>
      </svg>
    </button>


    <button
      class="viewer_prev"
      type="button"
      aria-label="Previous"
    >
      <svg
        class="leftchevron"
        viewBox="0 0 24 24"
        width="24"
        height="24"
        aria-hidden="true"
      >
        <use href="image/icons/navigation.svg#chevron_left"></use>
      </svg>
    </button>


    <div class="viewer_content">

      <div class="viewer_media"></div>


      <aside class="viewer_info">

        <div class="viewer_author"></div>

        <div class="viewer_title"></div>


        <dl class="viewer_details">

          <div class="viewer_detail">
            <dt>Characters</dt>
            <dd class="viewer_characters"></dd>
          </div>

          <div class="viewer_detail">
            <dt>Fandom</dt>
            <dd class="viewer_fandom"></dd>
          </div>

          <div class="viewer_detail viewer_year_row">
            <dt>Year</dt>
            <dd class="viewer_year"></dd>
          </div>

        </dl>


        <div class="viewer_warnings"></div>

      </aside>

    </div>


    <button
      class="viewer_next"
      type="button"
      aria-label="Next"
    >
      <svg
        class="year_chevron"
        viewBox="0 0 24 24"
        width="24"
        height="24"
        aria-hidden="true"
      >
        <use href="image/icons/navigation.svg#chevron_right"></use>
      </svg>
    </button>

  </section>

</main>


<script src="js/viewer.js"></script>

</body>

</html>
