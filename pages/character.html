<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Zhozabel</title>

  <link rel="stylesheet" href="../css/main.css">

  <link
    rel="shortcut icon"
    href="../images/icons/brandicons/icon-peach.svg"
    type="image/x-icon"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Quicksand:wght@300..700&display=swap"
    rel="stylesheet"
  >
</head>

<body>


<svg xmlns="http://www.w3.org/2000/svg"
     aria-hidden="true"
     style="position:absolute;width:0;height:0;overflow:hidden">

  <symbol id="heart_empty" viewBox="0 0 24 24">
    <path
      d="M12 7.69431C10 2.99988 3 3.49988 3 9.49991C3 15.4999 12 20.5001 12 20.5001C12 20.5001 21 15.4999 21 9.49991C21 3.49988 14 2.99988 12 7.69431Z"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </symbol>

  <symbol id="heart_fill" viewBox="0 0 24 24">
    <path
      d="M12 7.69431C10 2.99988 3 3.49988 3 9.49991C3 15.4999 12 20.5001 12 20.5001 12 20.5001 21 15.4999 21 9.49991 21 3.49988 14 2.99988 12 7.69431Z"
      fill="currentColor"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </symbol>

</svg>


<header class="header">
  <div class="container">

    <nav class="header_nav">

      <img
        src="../images/logos/logo_color_horizontal_without_outline.svg"
        alt="Zhozabel"
      >

      <ul class="header_list">

        <li class="header_list-item">
          <a class="header_list-link"
             href="../index.html"
             data-i18n="nav.about"
          >
            About
          </a>
        </li>

        <li class="header_list-item">
          <a class="header_list-link active"
             href="../pages/wiki.html"
             data-i18n="nav.wiki">
            Wiki
          </a>
        </li>

        <li class="header_list-item">
          <a class="header_list-link"
             href="../pages/contacts.html"
             data-i18n="nav.contact"
          >
            Contact
          </a>
        </li>

        <li class="header_list-item">
          <a class="header_button"
             href="../pages/commissions.html"
          data-i18n="nav.commissions">
            Commissions
          </a>
        </li>

      </ul>

    </nav>

  </div>
</header>


<!-- ========================================
     CHARACTER PAGE
======================================== -->

<main class="character_page">


  <!-- ======================================
       CHARACTER HEADER
  ====================================== -->

  <header class="character_header">

    <p
      class="character_fandom"
      id="characterFandom"
    ></p>

    <h1
      class="character_title"
      id="characterTitle"
    ></h1>

  </header>


  <!-- ======================================
       ERA / FORM SWITCHER
  ====================================== -->

  <section
    class="character_forms"
    id="characterForms"
  >
    <!-- Создаётся через JS -->
  </section>


  <!-- ======================================
       CHARACTER OVERVIEW
  ====================================== -->

  <section class="character_overview">


    <!-- Portrait -->

    <div class="character_portrait">

      <img
        src=""
        alt=""
        id="characterPortrait"
      >

    </div>


    <!-- Information -->

    <div class="character_overview-side">


      <!-- Basic information -->

      <section class="character_card">

        <h2 class="character_card-title"
            data-i18n="character.basicInfo">
          Основная информация
        </h2>

        <dl
          class="character_details"
          id="characterDetails"
        >
          <!-- Создаётся через JS -->
        </dl>

      </section>


      <!-- Connections -->

      <section class="character_card">

        <h2 class="character_card-title"
        data-i18n="character.connections">
          Связи
        </h2>

        <dl
          class="character_details"
          id="characterConnections"
        >
          <!-- Создаётся через JS -->
        </dl>

      </section>


    </div>

  </section>


  <!-- ======================================
       ARTICLE NAVIGATION
  ====================================== -->



  <nav
    class="character_nav"
    aria-label="Page navigation"
    data-i18n-aria-label="character.pageNavigation"
  >

    <a href="#appearance" data-i18n="character.appearance">
      Внешность
    </a>

    <a href="#personality" data-i18n="character.personality">
      Личность
    </a>

    <a href="#story" data-i18n="character.story">
      История
    </a>

    <a href="#abilities" data-i18n="character.abilities">
      Способности
    </a>

    <a href="#relationships" data-i18n="character.relationships">
      Отношения
    </a>

    <a href="#gallery" data-i18n="character.gallery">
      Галерея
    </a>
  </nav>



  <!-- ======================================
       APPEARANCE
  ====================================== -->

  <section
    class="character_section"
    id="appearance"
  >

    <h2 class="character_section-title"
    data-i18n="character.appearance">
      Внешность
    </h2>

    <div
      class="character_section-text"
      id="characterAppearance"
    ></div>

  </section>

  <!-- ======================================
       PERSONALITY
  ====================================== -->

  <section
    class="character_section"
    id="personality"
  >

    <h2 class="character_section-title"
        data-i18n="character.personality">
      Личность
    </h2>

    <div
      class="character_section-text"
      id="characterPersonality"
    ></div>

  </section>


  <!-- ======================================
       STORY
  ====================================== -->

  <section
    class="character_section"
    id="story"
  >

    <h2
      class="character_section-title"
      data-i18n="character.story"
    >
      История
    </h2>

    <div id="characterStorySections">
      <!-- Сюжетные арки создаются через JS -->
    </div>

  </section>

  <!-- ======================================
       ABILITIES
  ====================================== -->

  <section
    class="character_section"
    id="abilities"
  >

    <h2
      class="character_section-title"
      data-i18n="character.abilities"
    >
      Способности
    </h2>

    <div id="characterAbilitiesSections">
      <!-- Разделы способностей создаются через JS -->
    </div>

  </section>



  <!-- ======================================
       RELATIONSHIPS
  ====================================== -->

  <section
    class="character_section"
    id="relationships"
  >

    <h2 class="character_section-title"
    data-i18n="character.relationships">
      Отношения
    </h2>

    <div
      class="character_relationships"
      id="characterRelationships"
    ></div>

  </section>


  <!-- ======================================
       GALLERY
  ====================================== -->

  <section
    class="character_section"
    id="gallery"
  >

    <h2 class="character_section-title"
    data-i18n="character.gallery">
      Галерея
    </h2>

    <div
      class="character_gallery"
      id="characterGallery"
    ></div>

  </section>


</main>


<footer>
  <div class="container footer_container">
    <div class="footer_content">
      <div class="footer_copyright">
        © <span id="copyright-year"></span>
        <span data-i18n="footer.copyright">Copyright Zhozabel</span>
      </div>
    </div>

    <div
      class="footer_language-switch"
      role="group"
      aria-label="Choose language"
      data-i18n-aria-label="footer.language"
    >
      <button
        class="footer_language-button"
        type="button"
        data-lang-switch="en"
        aria-pressed="true"
      >EN</button>

      <span class="footer_language-divider" aria-hidden="true">/</span>

      <button
        class="footer_language-button"
        type="button"
        data-lang-switch="ru"
        aria-pressed="false"
      >RU</button>
    </div>
  </div>
</footer>

<script src="../js/i18n.js"></script>
<script src="../js/character.js"></script>

</body>

</html>
