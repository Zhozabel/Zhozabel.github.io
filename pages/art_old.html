<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Zhozabel</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="shortcut icon" href="../images/icons/brandicons/icon-peach.svg" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Quicksand:wght@300..700&display=swap"
        rel="stylesheet">
</head>

<body>

<header class="header">
  <div class="header_container">
    <nav class="header_nav">
      <img src="../images/logos/logo_color_horizontal_without_outline.svg" alt="">
      <ul class="header_list">
        <li class="header_list-item">
          <a class="header_list-link"
             href="/">About</a>
        </li>
        <li class="header_list-item">
          <a class="header_list-link"
             href="/">Wiki</a>
        </li>
        <li class="header_list-item">
          <a class="header_list-link"
             href="/">Contact</a>
        </li>
        <li class="header_list-item">
          <a class="header_button"
             href="/">Commissions</a>
        </li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="art-archive">
    <div class="archive_container">
      <div class="art-art-archive_content">
        <div class="art-archive_text">
          <span class="art-archive_category">01 · Visual</span>
          <h2 class="art-archive_title">Art</h2>
          <p class="art-archive_desc">Illustrations, character art, sketches and finished pieces.</p>
        </div>
      </div>

<!--      <div class="timeline">-->
<!--        <input type="radio" name="2026" value="2026">-->
<!--        <span class="timeline_circle"></span>-->
<!--        <span>2026</span>-->
<!--      </div>-->

      <div class="timeline">
        <section class="year collapsed">

          <button class="year_header" type="button">
            <span class="year_title">
              2026
            </span>
            <span class="year_toggle">
              <svg class="year_chevron"viewBox="0 0 24 24" width="24" height="24"><use xlink:href="image/icons/navigation.svg#chevron_down"></use></svg>
            </span>
          </button>

          <div class="year_content">
            <div class="year_gallery">
              <article class="art_card">
                <img src="../images/illustrations/illustration-KakashiHajoka.png">
              </article>
              <article class="art_card">
                <img src="../content/art/1.jpg">
              </article>
              <article class="art_card">
                <img src="../content/art/2.jpg">
              </article>
              <article class="art_card">
                <img src="../content/art/3.jpg">
              </article>
              <article class="art_card">
                <img src="../content/art/4.png">
              </article>
              <article class="art_card">
                <img src="../content/art/5.png">
              </article>
              <article class="art_card">
                <img src="../images/illustrations/illustration-KakashiHajoka.png">
              </article>
              <article class="art_card">
                <img src="../content/art/6.png">
              </article>
              <article class="art_card">
                <img src="../content/art/7.bmp">
              </article>
              <article class="art-card">
                <img src="content/art/8.jpg">
              </article>
            </div>
          </div>

        </section>

        <section class="year collapsed">
          <button class="year_header" type="button">
            <span class="year_title">
              2025
            </span>
            <span class="year_toggle">
              <svg class="year_chevron"viewBox="0 0 24 24" width="24" height="24"><use xlink:href="image/icons/navigation.svg#chevron_down"></use></svg>
            </span>
          </button>
        </section>

        <section class="year collapsed">
          <button class="year_header" type="button">
            <span class="year_title">
              2024
            </span>
            <span class="year_toggle">
              <svg class="year_chevron"viewBox="0 0 24 24" width="24" height="24"><use xlink:href="image/icons/navigation.svg#chevron_down"></use></svg>
            </span>
          </button>
        </section>
      </div>

    </div>
  </section>


</main>

<script>
  document.querySelectorAll('.year_header').forEach(header => {
    header.addEventListener('click', () => {
      const year = header.closest('.year');
      year.classList.toggle('collapsed');
    });
  });
</script>

</body>

</html>
