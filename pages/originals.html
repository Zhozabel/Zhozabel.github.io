<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Zhozabel</title>

  <link rel="stylesheet" href="../css/main.css">
  <link
    rel="shortcut icon"
    href="../images/icons/brandicons/icon-peach.svg"
    type="image/svg+xml"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Quicksand:wght@300..700&display=swap"
    rel="stylesheet"
  >
</head>

<body>
<header class="header">
  <div class="container">
    <nav class="header_nav">
      <img src="../images/logos/logo_color_horizontal_without_outline.svg" alt="">
      <ul class="header_list">
        <li class="header_list-item">
          <a class="header_list-link"
             href="../index.html"
             data-i18n="nav.about">About</a>
        </li>
        <li class="header_list-item">
          <a class="header_list-link"
             href="../pages/wiki.html"
             data-i18n="nav.wiki">Wiki</a>
        </li>
        <li class="header_list-item">
          <a class="header_list-link"
             href="../pages/contacts.html"
             data-i18n="nav.contact">Contact</a>
        </li>
        <li class="header_list-item">
          <a class="header_button"
             href="../pages/commissions.html"
             data-i18n="nav.commissions">Commissions</a>
        </li>
      </ul>
    </nav>
  </div>
</header>

<main>
  <section class="archive">
    <div class="container">
      <div class="archive_content">
        <div class="archive_text">
          <span class="archive_category" data-i18n="categories.words03">03 · Words</span>
          <h1 class="archive_title" data-i18n="categories.fiction">Fiction</h1>
          <p class="archive_desc" data-i18n="categories.fictionDescription">
            Original stories, characters, fragments and worldbuilding.
          </p>
        </div>
      </div>

      <div
        id="originals-timeline"
        class="works-timeline"
        data-file="../data/originals.json"
        data-type="original"
        aria-live="polite"
      ></div>
    </div>
  </section>
</main>

<footer>
  <div class="container footer_container">
    <div class="footer_content">
      <div class="footer_copyright">
        © <span id="copyright-year"></span>
        <span data-i18n="footer.copyright">Copyright Zhozabel</span>
      </div>
    </div>

    <div
      class="footer_language-switch"
      role="group"
      aria-label="Choose language"
      data-i18n-aria-label="footer.language"
    >
      <button
        class="footer_language-button is-active"
        type="button"
        data-lang-switch="en"
        aria-pressed="true"
      >EN</button>

      <span class="footer_language-divider" aria-hidden="true">/</span>

      <button
        class="footer_language-button"
        type="button"
        data-lang-switch="ru"
        aria-pressed="false"
      >RU</button>
    </div>
  </div>
</footer>

<script>
  document.getElementById("copyright-year").textContent =
    new Date().getFullYear();
</script>

<script src="../js/i18n.js"></script>
<script src="../js/works-timeline.js"></script>
</body>
</html>
