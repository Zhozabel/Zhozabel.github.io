<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Zhozabel</title>

  <link rel="stylesheet" href="../../css/main.css">

  <link
    rel="shortcut icon"
    href="../../images/icons/brandicons/icon-peach.svg"
    type="image/x-icon"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Quicksand:wght@300..700&display=swap"
    rel="stylesheet"
  >
</head>


<body>

<header class="header">

  <div class="container">

    <nav class="header_nav">

      <img
        src="../../images/logos/logo_color_horizontal_without_outline.svg"
        alt="Zhozabel"
      >

      <ul class="header_list">
        <li class="header_list-item">
          <a class="header_list-link"
             href="../../index.html"
             data-i18n="nav.about">About</a>
        </li>

        <li class="header_list-item">
          <a class="header_list-link"
             href="../../pages/wiki.html"
             data-i18n="nav.wiki">Wiki</a>
        </li>

        <li class="header_list-item">
          <a class="header_list-link"
             href="../../pages/contacts.html"
             data-i18n="nav.contact">Contact</a>
        </li>

        <li class="header_list-item">
          <a class="header_button"
             href="../../pages/commissions.html"
             data-i18n="nav.commissions">Commissions</a>
        </li>
      </ul>

    </nav>

  </div>

</header>


<main>

  <article class="chapter_page">

    <!-- Chapter header -->

    <header class="chapter_header">

      <h1 class="chapter_title"></h1>

      <time class="chapter_date"></time>

    </header>


    <!-- Top navigation -->

    <div class="container">
    <nav
      class="chapter_navigation"
      aria-label="Chapter navigation"
    >

      <a
        class="chapter_navigation-link"
        href="#"
      ></a>

      <a
        class="chapter_navigation-link chapter_navigation-center"
        href="../story.html"
      >
        <span data-i18n="chapter.contents">Contents</span>
      </a>

      <a
        class="chapter_navigation-link"
        href="#"
      ></a>

    </nav>
    </div>


    <!-- Chapter content -->

    <div class="container">
    <section class="chapter_content">
      <!-- Markdown content is inserted by chapter.js -->
    </section>
    </div>


    <!-- Bottom navigation -->

    <div class="container">
    <nav
      class="chapter_navigation"
      aria-label="Chapter navigation"
    >

      <a
        class="chapter_navigation-link"
        href="#"
      ></a>

      <a
        class="chapter_navigation-link chapter_navigation-center"
        href="../story.html"
      >
        <span data-i18n="chapter.contents">Contents</span>
      </a>

      <a
        class="chapter_navigation-link"
        href="#"
      ></a>

    </nav>
    </div>

  </article>

</main>

<footer>
  <div class="container footer_container">
    <div class="footer_content">
      <div class="footer_copyright">
        © <span id="copyright-year"></span>
        <span data-i18n="footer.copyright">Copyright Zhozabel</span>
      </div>
    </div>

    <div class="footer_language-switch"
         role="group"
         data-i18n-aria-label="footer.language"
         aria-label="Choose language">

      <button class="footer_language-button"
              type="button"
              data-lang-switch="en"
              aria-pressed="true">
        EN
      </button>

      <span class="footer_language-divider" aria-hidden="true">/</span>

      <button class="footer_language-button"
              type="button"
              data-lang-switch="ru"
              aria-pressed="false">
        RU
      </button>
    </div>
  </div>
</footer>

<script>
  document.getElementById("copyright-year").textContent =
    new Date().getFullYear();
</script>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="../../js/i18n.js"></script>
<script src="../../js/chapter.js"></script>


</body>

</html>
