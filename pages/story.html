<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Story — Zhozabel</title>

  <link rel="stylesheet" href="../css/main.css">
  <link rel="stylesheet" href="../css/components/icon.css">

  <link
    rel="shortcut icon"
    href="../images/icons/brandicons/icon-peach.svg"
    type="image/svg+xml"
  >

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Hachi+Maru+Pop&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Quicksand:wght@300..700&display=swap"
    rel="stylesheet"
  >
</head>

<body>

<header class="header">
  <div class="container">
    <nav class="header_nav">

      <img
        src="../images/logos/logo_color_horizontal_without_outline.svg"
        alt="Zhozabel"
      >

      <ul class="header_list">
        <li class="header_list-item">
          <a
            class="header_list-link"
            href="../index.html"
            data-i18n="nav.about"
          >About</a>
        </li>

        <li class="header_list-item">
          <a
            class="header_list-link"
            href="/"
            data-i18n="nav.wiki"
          >Wiki</a>
        </li>

        <li class="header_list-item">
          <a
            class="header_list-link"
            href="/"
            data-i18n="nav.contact"
          >Contact</a>
        </li>

        <li class="header_list-item">
          <a
            class="header_button"
            href="/"
            data-i18n="nav.commissions"
          >Commissions</a>
        </li>
      </ul>

    </nav>
  </div>
</header>

<main>
  <div class="story_page container">

    <!-- LEFT COLUMN -->
    <section class="story_main">

      <!-- BANNER -->
      <div class="story_banner">
        <img
          class="story_banner-image"
          src=""
          alt=""
        >

        <div class="story_banner-genres"></div>
      </div>

      <!-- COVER -->
      <button class="story_cover" type="button">
        <img
          class="story_cover-image"
          src=""
          alt=""
        >
      </button>

      <!-- CHAPTERS -->
      <section class="story_chapters">
        <h2
          class="story_section-title"
          data-i18n="story.chapters"
        >Chapters</h2>

        <div class="story_chapter-list">
          <!-- Chapters are generated by story.js -->
        </div>
      </section>

    </section>

    <!-- RIGHT COLUMN -->
    <aside class="story_sidebar">

      <!-- DESCRIPTION -->
      <section class="story_description">
        <h1 class="story_title"></h1>
        <div class="story_description-text"></div>
      </section>

      <!-- GENRES -->
      <section class="story_meta">
        <h2
          class="story_meta-title"
          data-i18n="story.genres"
        >Genres</h2>

        <div class="story_genres"></div>
      </section>

      <!-- RATING -->
      <section class="story_meta">
        <h2
          class="story_meta-title"
          data-i18n="story.rating"
        >Rating</h2>

        <span class="story_rating"></span>
      </section>

      <!-- WARNINGS -->
      <section class="story_meta">
        <h2
          class="story_meta-title"
          data-i18n="story.warnings"
        >Warnings</h2>

        <div class="story_warnings"></div>
      </section>

    </aside>

  </div>
</main>

<footer>
  <div class="container footer_container">

    <div class="footer_content">
      <div class="footer_copyright">
        © <span id="copyright-year"></span>
        <span data-i18n="footer.copyright">Copyright Zhozabel</span>
      </div>
    </div>

    <div
      class="footer_language-switch"
      role="group"
      aria-label="Choose language"
      data-i18n-aria-label="footer.language"
    >
      <button
        class="footer_language-button"
        type="button"
        data-lang-switch="en"
        aria-pressed="true"
      >EN</button>

      <span class="footer_language-divider" aria-hidden="true">/</span>

      <button
        class="footer_language-button"
        type="button"
        data-lang-switch="ru"
        aria-pressed="false"
      >RU</button>
    </div>

  </div>
</footer>

<script>
  document.getElementById("copyright-year").textContent =
    new Date().getFullYear();
</script>

<script src="../js/story.js" defer></script>
<script src="../js/i18n.js" defer></script>

</body>
</html>
